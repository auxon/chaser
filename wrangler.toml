name = "chaser"
main = "src/index.ts"
compatibility_date = "2025-08-16"

[[d1_databases]]
binding = "DB"
database_name = "chaser"
# created 2026-09-08 via: wrangler d1 create chaser
database_id = "8ea4be3a-2537-4a1a-a102-9a03b5864ec1"

routes = [
  { pattern = "entangleit.com/chaser*", zone_name = "entangleit.com" }
]

[triggers]
crons = ["*/15 * * * *"] # sequence engine tick

[vars]
APP_URL = "https://entangleit.com/chaser"
PRICE_MONTHLY = "price_REPLACE_ME" # £29/mo Price in OUR Stripe account
TRIAL_DAYS = "14"

# secrets (wrangler secret put): OUR_STRIPE_KEY, STRIPE_WEBHOOK_SECRET,
# RAK_MASTER_KEY (32-byte hex for RAK encryption), RESEND_API_KEY, SESSION_SALT
